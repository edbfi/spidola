# prek.toml — pre-commit hooks configuration
# Docs: https://prek.j178.dev/configuration/
#:schema https://www.schemastore.org/prek.json

minimum_prek_version = "0.3.2"
default_install_hook_types = ["pre-commit", "commit-msg"]
default_stages = ["pre-commit", "manual"]

# Builtin hooks — fast, offline, Rust-native
[[repos]]
repo = "builtin"
hooks = [
  # Generated UniFFI bindings must match gen-bindings byte-for-byte.
  { id = "trailing-whitespace", exclude = "^apps/(tvos/Packages/CoreKit/Generated|androidtv/core/corekit/generated)/" },
  { id = "end-of-file-fixer", exclude = "^apps/(tvos/Packages/CoreKit/Generated|androidtv/core/corekit/generated)/" },
  { id = "mixed-line-ending", args = ["--fix=lf"], exclude = "^apps/(tvos/Packages/CoreKit/Generated|androidtv/core/corekit/generated)/" },
  { id = "check-merge-conflict" },
  { id = "check-case-conflict" },
  { id = "check-added-large-files", args = ["--maxkb=512"] },
  { id = "detect-private-key" },
  { id = "check-json" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "no-commit-to-branch", args = ["--branch", "main"] },
]

# Conventional Commits — enforce Conventional Commit message format
[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "v4.4.0"
hooks = [
  { id = "conventional-pre-commit", stages = ["commit-msg"] },
]

# Secret / credential leak guard — fixtures and dotfiles must never carry tokens
[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"
hooks = [
  { id = "gitleaks" },
]

# Local hooks — project-specific quality gates
# These are the fast local mirror of the three CI lanes (TECH_SPEC §9): the same
# format/lint failures surface here and in CI. Heavier gates stay in CI only — full
# Swift/Kotlin compilation (type-checking), the emulator/simulator smoke tests, and the
# REUSE/SPDX lint — so commits stay quick. Complexity/length lints remain ADVISORY
# (warn) per the modularity doctrine (TECH_SPEC §3.1) and are never wired as blocking
# hooks. Each language keeps its native tooling (Biome has no Rust/Swift/Kotlin support).
[[repos]]
repo = "local"
hooks = [
  # DCO sign-off — every commit certifies the DCO and grants the App Store exception
  # (CONTRIBUTING.md + APPSTORE_EXCEPTION.md; decision logged in TECH_SPEC §14). Commit with `git commit -s`.
  # The GitHub DCO check on PRs is the authoritative gate; this is the fast local mirror.
  { id = "dco-signoff", name = "DCO sign-off (Signed-off-by)", entry = "sh -c 'grep -qE \"^Signed-off-by: .+ <.+@.+>\" \"$1\" || { echo \"Commit message is missing a Signed-off-by line (DCO). Commit with: git commit -s\"; exit 1; }' --", language = "system", stages = ["commit-msg"], always_run = true },
  # Rust workspace — crates/ and tools/test-headend/ plus build configuration.
  { id = "cargo-fmt", name = "cargo fmt", entry = "cargo fmt --all", language = "system", files = "(^(crates|tools/test-headend)/.*\\.rs$|(^|/)Cargo\\.toml$|^(rustfmt|rust-toolchain)\\.toml$)", pass_filenames = false },
  { id = "cargo-clippy", name = "cargo clippy", entry = "cargo clippy --workspace --all-targets --all-features -- -D warnings", language = "system", files = "(^(crates|tools/test-headend)/.*\\.rs$|(^|/)Cargo\\.(toml|lock)$|^(rust-toolchain|clippy)\\.toml$|^\\.cargo/config\\.toml$)", pass_filenames = false },
  # Secret-logging guard — no log macro may format an exposed secret value (TECH_SPEC §4.8, §12).
  { id = "check-secret-logging", name = "secret-logging guard", entry = "tools/ci/check-secret-logging.sh", language = "system", files = "(^crates/.*\\.rs$|^tools/ci/check-secret-logging\\.sh$)", pass_filenames = false },
  { id = "translations", name = "translation catalogs", entry = "python3 tools/community/validate-translations.py", language = "system", files = "(^crowdin\\.yml$|^tools/community/validate-translations\\.py$|^apps/(tvos/.+\\.xcstrings|androidtv/.+/res/(values|values-[^/]+)/strings\\.xml)$)", pass_filenames = false },
  # cargo-deny — advisory feed + license allow-list (§12); runs on manifest/lock/deny changes.
  { id = "cargo-deny", name = "cargo deny", entry = "cargo deny check", language = "system", files = "(^|/)(Cargo\\.(toml|lock)|deny\\.toml)$", pass_filenames = false },
  # tvOS shell — apps/tvos/ (toolchain-bundled swift-format + SwiftLint; §9 apple lane).
  # UniFFI-generated bindings and the bare FFI contract harness are excluded: the generated
  # Swift must match `xtask gen-bindings` byte-for-byte (reformatting it would fail the drift
  # check), and the harness is test plumbing, not shell code (mirrors the Apple CI exclusions).
  { id = "swift-format", name = "swift-format", entry = "swift format --in-place", language = "system", types = ["swift"], files = "^apps/tvos/", exclude = "^apps/tvos/(Packages/CoreKit/Generated|contract-harness)/" },
  { id = "swiftlint", name = "swiftlint", entry = "swiftlint lint --strict", language = "system", files = "(^apps/tvos/.*\\.swift$|^\\.swiftlint\\.yml$)", exclude = "^apps/tvos/(Packages/CoreKit/Generated|contract-harness)/", pass_filenames = false },
  # Android TV shell — apps/androidtv/ (ktlint + detekt with the Compose ruleset; §9 android lane).
  # Gradle-driven checks cover Kotlin sources and their build/lint configuration.
  # The generated bindings and the bare harness live outside the Gradle source sets and are excluded here too.
  { id = "ktlint", name = "ktlint", entry = "apps/androidtv/gradlew --project-dir apps/androidtv ktlintCheck", language = "system", files = "^apps/androidtv/(.*\\.kts?$|.*\\.toml$|.*\\.properties$|\\.editorconfig$|config/detekt/.*\\.ya?ml$|gradlew$|gradle/wrapper/)", exclude = "^apps/androidtv/(contract-harness|core/corekit/generated)/", pass_filenames = false },
  { id = "detekt", name = "detekt", entry = "apps/androidtv/gradlew --project-dir apps/androidtv detekt", language = "system", files = "^apps/androidtv/(.*\\.kts?$|.*\\.toml$|.*\\.properties$|\\.editorconfig$|config/detekt/.*\\.ya?ml$|gradlew$|gradle/wrapper/)", exclude = "^apps/androidtv/(contract-harness|core/corekit/generated)/", pass_filenames = false },
]
